// Сборка локального нативного модуля. Структура повторяет обычный модуль Expo
// (см. любой пакет expo-* в node_modules): плагин expo-module-gradle-plugin
// подставляет версии compileSdk/kotlin из приложения, поэтому здесь их нет.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.keepalive'
version = '1.0.0'

android {
  namespace 'expo.modules.keepalive'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

repositories {
  mavenCentral()
}

dependencies {
  // NotificationCompat — из core-ktx; та же версия, что использует expo-audio.
  implementation 'androidx.core:core-ktx:1.15.0'
  // ReactHost и headless-задачи: служба сама поднимает JS-часть, когда Activity
  // уже нет (см. KeepAliveService.startJsTask). Версию подставляет
  // expo-module-gradle-plugin из приложения — так же, как это делает
  // expo-modules-core.
  implementation 'com.facebook.react:react-android'
}
