name: Build preview APK (EAS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Собрать общий крипто-пакет
        run: |
          cd packages/crypto
          npm install
          npm run build

      - name: Установить зависимости клиента
        run: |
          cd app
          npm install

      - name: Привязать/создать EAS-проект (нужно перед non-interactive build)
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest init --non-interactive --force

      # Собираем на раннере, а не в облаке EAS: бесплатный план Expo даёт
      # ограниченное число облачных Android-сборок в месяц, и оно кончается.
      # Локальная сборка эту квоту не тратит, а ключ подписи берёт с серверов
      # Expo — то есть подпись остаётся той же (см. docs/BUILD.md §0).
      - name: Собрать APK на раннере (preview, без облачной квоты)
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set +e
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/family-messenger.apk"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "--- последние сборки проекта на стороне EAS (для контекста) ---"
            npx eas-cli@latest build:list --limit 3 --json --non-interactive || true
          fi
          exit "$code"

      - name: Проверить артефакт
        run: ls -la "$GITHUB_WORKSPACE/family-messenger.apk"

      - name: Опубликовать в GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-build-${{ github.run_number }}
          name: "Автономная сборка (preview) #${{ github.run_number }}"
          body: |
            Автономный Android APK (EAS Build, профиль `preview`), собрано
            из коммита ${{ github.sha }}. В отличие от dev-client-сборки —
            ставится и работает сама по себе, Metro/компьютер не нужен.

            Установка: скачай `family-messenger.apk`, разреши установку из
            неизвестных источников, установи. При первом запуске введи код
            инвайта и адрес сервера (wss://.../ws).
          files: family-messenger.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
