name: Build release APK (EAS)

# Релизная сборка — та, что раздаётся людям. Отличается от preview тем, что
# versionCode увеличивает сам EAS (autoIncrement в eas.json), поэтому Android
# видит её как обновление, а в настройках → Диагностика видно, кто обновился.
#
# Ключ подписи тот же, что у preview-сборок: он один на проект (см. docs/BUILD.md
# §0 и §2). Поэтому релиз ставится поверх уже установленного APK как обновление,
# и ни ключи в Keystore, ни переписка не теряются.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Проверки отдельной задачей и до сборки: релиз раздаётся людям, и собрать
  # заведомо сломанный бандл дороже, чем подождать пять минут. Сборка не
  # запустится, если что-то из этого упало.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Крипто-пакет и его тесты
        run: |
          cd packages/crypto
          npm install
          npm run build
          npm test

      - name: Зависимости клиента
        run: |
          cd app
          npm install

      - name: Проверки клиента
        working-directory: app
        run: |
          npx tsc --noEmit
          npm run check:sql
          npm run check:imports
          npm run check:android

      - name: Сборка бандла (проверка, что Metro не падает)
        working-directory: app
        run: npx expo export --platform android --output-dir /tmp/export-check

      - name: Сервер — типы и сборка
        run: |
          cd server
          npm install
          npx tsc --noEmit
          npm run build

  build:
    needs: checks
    runs-on: ubuntu-latest
    # Компиляция Android идёт минут 20–40. Дефолтные 360 минут не нужны, но и
    # обрывать на 30 нельзя: очередь npm и Gradle бывают медленными.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Gradle для Android SDK 36 требует JDK 17. На раннере есть несколько
      # версий, и без явного выбора берётся не та.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Собрать общий крипто-пакет
        run: |
          cd packages/crypto
          npm install
          npm run build

      - name: Установить зависимости клиента
        run: |
          cd app
          npm install

      - name: Привязать/создать EAS-проект (нужно перед non-interactive build)
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest init --non-interactive --force

      # Сборка на самом раннере, а не в облаке EAS.
      #
      # Почему так: бесплатный план Expo даёт ограниченное число облачных
      # Android-сборок в месяц, и оно кончается («This account has used its
      # Android builds from the Free plan this month»). Локальная сборка эту
      # квоту не тратит вообще — считает GitHub, а не Expo.
      #
      # Ключ подписи при этом остаётся ТОТ ЖЕ: --local берёт credentials с
      # серверов Expo (для этого и нужен EXPO_TOKEN). Это принципиально —
      # APK с другой подписью не встал бы поверх установленного, и людям
      # пришлось бы удалять приложение вместе с ключами и перепиской
      # (docs/BUILD.md §0).
      - name: Собрать APK на раннере (production, без облачной квоты)
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Иначе Gradle на раннере упирается в дефолтный heap и падает на
          # оптимизации бандла с OutOfMemoryError.
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set +e
          npx eas-cli@latest build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/cry.apk"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "--- последние сборки проекта на стороне EAS (для контекста) ---"
            npx eas-cli@latest build:list --limit 3 --json --non-interactive || true
          fi
          exit "$code"

      - name: Проверить артефакт и достать versionCode
        run: |
          ls -la "$GITHUB_WORKSPACE/cry.apk"
          # versionCode берём из самого APK: при appVersionSource=remote его
          # присваивает EAS, и угадывать его в описании релиза не надо.
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          VERSION=$("$AAPT" dump badging "$GITHUB_WORKSPACE/cry.apk" 2>/dev/null \
            | grep -oE "versionCode='[0-9]+'" | head -1 | grep -oE "[0-9]+")
          echo "versionCode = ${VERSION:-?}"
          echo "VERSION_CODE=${VERSION:-?}" >> "$GITHUB_ENV"

      - name: Опубликовать в GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: "Cry — релиз #${{ github.run_number }} (versionCode ${{ env.VERSION_CODE }})"
          body: |
            Релизный Android APK (профиль `production`, собран на раннере
            GitHub — облачная квота Expo не тратится) из коммита
            ${{ github.sha }}. Перед сборкой прошли тесты крипто-пакета,
            проверки клиента и сборка бандла.

            **Ставится поверх прежней версии как обновление** — ключ подписи тот
            же, что у preview-сборок. Удалять приложение не нужно и не следует:
            удаление уносит ключи из Keystore вместе со всей перепиской
            (docs/BUILD.md §0).

            **Сначала обнови сервер**, иначе часть возможностей не заработает:

            ```
            cd ~/family-messenger && git pull
            NODE_IMAGE=mirror.gcr.io/library/node:20-bookworm \
            NODE_SLIM_IMAGE=mirror.gcr.io/library/node:20-bookworm-slim \
            docker compose up -d --build
            ```

            **После установки — два дела, каждому:**

            1. Настройки → **Аккаунт** → «Привязать почту и пароль». Пока их нет,
               потеря телефона означает потерю доступа навсегда.
            2. Настройки → **Резервная копия** → «Создать копию» с кодовой фразой.
               Только она возвращает переписку на новом телефоне: ключи
               расшифровки не покидают прежний, и сервер помочь не может.
          files: cry.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
