name: Build & Release APK

on:
  push:
    branches: [ "claude/android-vertical-game-0odlqg", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk pathogen-v1.0.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pathogen-apk
          path: pathogen-v1.0.apk
          retention-days: 90

      - name: Delete old release if exists
        run: gh release delete v1.0 --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "🦠 Pathogen v1.0 — World Domination"
          body: |
            ## 🦠 PATHOGEN: World Domination

            Стратегическая игра — заразите весь мир до создания лекарства!

            ---

            ### 📲 Установка на телефон
            1. Скачай **`pathogen-v1.0.apk`** ниже
            2. Открой файл на телефоне (Android 7.0+)
            3. Разреши установку: **Настройки → Безопасность → Неизвестные источники**
            4. Установи и играй!

            ---

            ### 🎮 Геймплей
            - Выбери стартовую страну на карте мира (23 страны)
            - Наблюдай как вирус распространяется по соседним странам
            - Зарабатывай **🧬 ДНК очки** → трать на **мутации**
            - Успей заразить **100% населения** до создания лекарства

            ### 🔬 Мутации (16 апгрейдов)
            **Передача:** Аэрозоль, Водный путь, Холодостойкость, Жаростойкость, Птичий вектор, Морские течения
            **Тяжесть:** Кашель, Геморрагия, Лекарственная стойкость, Генетическое укрепление
            **Способности:** Вспышка мутаций, Латентность, Хаос, Биоплёнка
          files: pathogen-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
