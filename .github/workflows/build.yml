name: Build & Release APK

on:
  push:
    branches: [ "claude/android-vertical-game-0odlqg", "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pathogen-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Pathogen ${{ github.ref_name }}"
          body: |
            ## 🦠 PATHOGEN: World Domination

            Стратегическая игра — заразите весь мир до создания лекарства.

            ### Установка
            1. Скачай `pathogen-debug.apk`
            2. Разреши установку из неизвестных источников (Настройки → Безопасность)
            3. Открой файл и установи

            ### Геймплей
            - Выбери стартовую страну → наблюдай за распространением вируса
            - Зарабатывай ДНК очки → покупай мутации
            - Успей заразить весь мир до создания лекарства!
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
