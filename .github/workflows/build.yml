name: Build & Release APK

on:
  push:
    branches: [ "claude/android-vertical-game-0odlqg", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk pathogen-v2.0.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pathogen-apk
          path: pathogen-v2.0.apk
          retention-days: 90

      - name: Delete old release if exists
        run: gh release delete v2.0 --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release v2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: "🦠 Pathogen v2.0 — Глобальная пандемия"
          body: |
            ## 🦠 PATHOGEN v2.0 — Глобальная пандемия

            Стратегическая игра в стиле Plague Inc — заразите весь мир до создания лекарства!

            ---

            ### 📲 Установка на телефон
            1. Скачай **`pathogen-v2.0.apk`** ниже
            2. Открой файл на телефоне (Android 7.0+)
            3. Разреши установку: **Настройки → Безопасность → Неизвестные источники**
            4. Установи и играй!

            ---

            ### 🆕 Что нового в v2.0
            - 🔍 **Зум и панорамирование карты** — pinch двумя пальцами, тащи одним
            - 🌍 **Размер стран по населению** — Индия и Китай большие, Австралия маленькая
            - ✨ **Звёздный фон** с анимацией мерцания
            - 🔴 **Частицы заражения** летят по маршрутам между странами
            - 💛 **Кольцо выделения** вокруг выбранной страны
            - 💧 Изогнутые линии маршрутов (кривые Безье)
            - 🗺️ Тени континентов и сетка меридианов
            - 📋 **Инфопанель страны** — флаг, население, климат, % заражения
            - ⏸ **Кнопки скорости** — пауза / 1× / 2×
            - 📰 **8 случайных событий** — ВОЗ, карантины, прорывы в науке
            - 🧬 Список мутаций не закрывается при покупке
            - 🎨 Цветные полоски категорий в карточках мутаций

            ### ⚠️ Сложность повышена
            - Заражение идёт медленнее — нужна стратегия
            - Лекарство разрабатывается быстрее при обнаружении
            - Начинай со страны с умеренным климатом!

            ---

            ### 🎮 Геймплей
            - Выбери стартовую страну (23 страны мира)
            - Следи за распространением и покупай мутации
            - Успей заразить **100% населения** до создания лекарства

            ### 🔬 Мутации (16 апгрейдов)
            **Передача:** Аэрозоль, Водный путь, Холодостойкость, Жаростойкость, Птичий вектор, Морские течения
            **Тяжесть:** Кашель, Геморрагия, Лекарственная стойкость, Генетическое укрепление
            **Способности:** Вспышка мутаций, Латентность, Хаос, Биоплёнка
          files: pathogen-v2.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
