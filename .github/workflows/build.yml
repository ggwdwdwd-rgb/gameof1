name: Build & Release APK

on:
  push:
    branches: [ "claude/android-vertical-game-0odlqg", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk pathogen-v1.0.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pathogen-apk
          path: pathogen-v1.0.apk
          retention-days: 90

      - name: Delete old release if exists
        run: |
          gh release delete v1.0 --yes 2>/dev/null || true
          git push origin :refs/tags/v1.0 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "🦠 Pathogen v1.0 — World Domination"
          body: |
            ## 🦠 PATHOGEN: World Domination

            Стратегическая игра — заразите весь мир до создания лекарства!

            ---

            ### 📲 Установка на телефон
            1. Скачай файл **`pathogen-v1.0.apk`** ниже
            2. Открой на телефоне (Android 7.0+)
            3. Разреши установку: **Настройки → Безопасность → Неизвестные источники**
            4. Установи и играй!

            ---

            ### 🎮 Геймплей
            - Выбери стартовую страну на карте мира (23 страны)
            - Наблюдай как вирус распространяется по соседним странам
            - Зарабатывай **🧬 ДНК очки** → трать на **мутации**
            - Успей заразить **100% населения** до создания лекарства
            - Учёные разрабатывают лекарство всё быстрее — торопись!

            ### 🔬 Мутации (16 апгрейдов)
            | Передача | Тяжесть | Способности |
            |----------|---------|-------------|
            | Аэрозоль | Кашель | Вспышка мутаций |
            | Водный путь | Геморрагия | Латентность |
            | Холодостойкость | Лекарственная стойкость | Хаос |
            | Жаростойкость | Генетическое укрепление | Биоплёнка |
            | Птичий вектор | | |
            | Морские течения | | |
          files: pathogen-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
